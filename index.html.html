<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的记录本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            background: #f0f0f0;
            color: #666;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            margin-bottom: 20px;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #764ba2;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .records-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .record-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: all 0.3s;
            border-left: 4px solid #764ba2;
        }

        .record-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .record-content {
            flex: 1;
            margin-right: 15px;
        }

        .record-content p {
            color: #333;
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .record-time {
            color: #999;
            font-size: 12px;
        }

        .record-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 15px;
        }

        .btn-edit {
            background: #4ecdc4;
            color: white;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .todo-item.done .record-content p {
            text-decoration: line-through;
            color: #999;
        }

        .todo-item.done {
            border-left-color: #4ecdc4;
            opacity: 0.7;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            background: #f8f9fa;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .tabs {
                flex-direction: column;
                align-items: center;
            }

            .tab-btn {
                width: 100%;
                max-width: 300px;
            }

            .record-item {
                flex-direction: column;
            }

            .record-actions {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 我的记录本</h1>
            <p style="color: #999;">记录生活，留住美好</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="notes">📝 笔记</button>
            <button class="tab-btn" data-tab="todos">✅ 待办事项</button>
            <button class="tab-btn" data-tab="diary">📖 日记</button>
        </div>

        <!-- 笔记标签页 -->
        <div id="notes" class="tab-content active">
            <div class="input-area">
                <textarea id="noteInput" placeholder="写下你的想法..."></textarea>
                <button class="btn btn-primary" onclick="addRecord('notes')">保存笔记</button>
            </div>
            <div class="search-bar">
                <input type="text" id="noteSearch" placeholder="搜索笔记..." oninput="searchRecords('notes')">
            </div>
            <div id="notesList" class="records-list"></div>
        </div>

        <!-- 待办事项标签页 -->
        <div id="todos" class="tab-content">
            <div class="input-area">
                <input type="text" id="todoInput" placeholder="添加待办事项...">
                <button class="btn btn-primary" onclick="addRecord('todos')">添加待办</button>
            </div>
            <div id="todosList" class="records-list"></div>
        </div>

        <!-- 日记标签页 -->
        <div id="diary" class="tab-content">
            <div class="input-area">
                <textarea id="diaryInput" placeholder="记录今天的心情和经历..."></textarea>
                <button class="btn btn-primary" onclick="addRecord('diary')">保存日记</button>
            </div>
            <div id="diaryList" class="records-list"></div>
        </div>
    </div>

    <script>
        // 数据存储
        let records = {
            notes: [],
            todos: [],
            diary: []
        };

        // 从本地存储加载数据
        function loadData() {
            const savedData = localStorage.getItem('myRecords');
            if (savedData) {
                records = JSON.parse(savedData);
            }
        }

        // 保存数据到本地存储
        function saveData() {
            localStorage.setItem('myRecords', JSON.stringify(records));
        }

        // 获取当前激活的标签页
        function getActiveTab() {
            return document.querySelector('.tab-btn.active').dataset.tab;
        }

        // 标签页切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                const tabId = this.dataset.tab;
                document.getElementById(tabId).classList.add('active');
                
                displayRecords(tabId);
            });
        });

        // 添加记录
        function addRecord(type) {
            const inputMap = {
                notes: 'noteInput',
                todos: 'todoInput',
                diary: 'diaryInput'
            };

            const input = document.getElementById(inputMap[type]);
            const content = input.value.trim();

            if (!content) {
                alert('请输入内容');
                return;
            }

            const record = {
                id: Date.now(),
                content: content,
                time: new Date().toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                done: false
            };

            records[type].unshift(record);
            saveData();
            input.value = '';
            displayRecords(type);
        }

        // 显示记录
        function displayRecords(type, searchTerm = '') {
            const listMap = {
                notes: 'notesList',
                todos: 'todosList',
                diary: 'diaryList'
            };

            const list = document.getElementById(listMap[type]);
            let recordsToShow = records[type];

            // 搜索过滤
            if (searchTerm) {
                recordsToShow = recordsToShow.filter(r => 
                    r.content.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (recordsToShow.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>暂无记录</p>
                        <p style="font-size: 14px;">开始添加你的第一条记录吧！</p>
                    </div>
                `;
                return;
            }

            let html = '';
            recordsToShow.forEach(record => {
                const isTodo = type === 'todos';
                const doneClass = record.done ? 'done' : '';
                
                html += `
                    <div class="record-item ${isTodo ? 'todo-item ' + doneClass : ''}" data-id="${record.id}">
                        <div class="record-content">
                            ${isTodo ? `
                                <div class="checkbox-wrapper">
                                    <input type="checkbox" ${record.done ? 'checked' : ''} 
                                           onchange="toggleTodo(${record.id})">
                                    <p>${escapeHtml(record.content)}</p>
                                </div>
                            ` : `
                                <p>${escapeHtml(record.content)}</p>
                            `}
                            <div class="record-time">${record.time}</div>
                        </div>
                        <div class="record-actions">
                            ${!isTodo ? `
                                <button class="btn btn-small btn-edit" onclick="editRecord(${record.id}, '${type}')">✏️ 编辑</button>
                            ` : ''}
                            <button class="btn btn-small btn-delete" onclick="deleteRecord(${record.id}, '${type}')">🗑️ 删除</button>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        // 转义HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 切换待办状态
        function toggleTodo(id) {
            const todo = records.todos.find(t => t.id === id);
            if (todo) {
                todo.done = !todo.done;
                saveData();
                displayRecords('todos');
            }
        }

        // 编辑记录
        function editRecord(id, type) {
            const record = records[type].find(r => r.id === id);
            if (!record) return;

            const newContent = prompt('编辑内容：', record.content);
            if (newContent !== null && newContent.trim()) {
                record.content = newContent.trim();
                record.time = new Date().toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                saveData();
                displayRecords(type);
            }
        }

        // 删除记录
        function deleteRecord(id, type) {
            if (confirm('确定要删除这条记录吗？')) {
                records[type] = records[type].filter(r => r.id !== id);
                saveData();
                displayRecords(type);
            }
        }

        // 搜索笔记
        function searchRecords(type) {
            const searchInput = document.getElementById('noteSearch');
            const searchTerm = searchInput.value.trim();
            displayRecords(type, searchTerm);
        }

        // 初始化
        loadData();
        displayRecords('notes');

        // 支持回车键添加
        document.getElementById('todoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addRecord('todos');
            }
        });

        document.getElementById('noteInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                addRecord('notes');
            }
        });

        document.getElementById('diaryInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                addRecord('diary');
            }
        });
    </script>
</body>
</html>
