<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 我的阅读书单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f7; color: #1d1d1f; padding-bottom: 80px;
  }
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
    padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .header h1 { font-size: 20px; font-weight: 700; }
  .stats { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; color: #666; }
  .stats span { cursor: pointer; padding: 4px 10px; border-radius: 15px; background: #f0f0f0; }
  .stats span.active { background: #1d1d1f; color: #fff; }
  .toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .toolbar button {
    padding: 8px 14px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer;
    background: #1d1d1f; color: #fff;
  }
  .toolbar button.sec { background: #fff; border: 1px solid #ddd; color: #1d1d1f; }
  .search-bar { padding: 10px 15px; }
  .search-bar input {
    width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 14px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 15px;
  }
  .card {
    background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer; transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }
  .card-cover {
    aspect-ratio: 3/4; background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px;
    position: relative;
  }
  .card-cover img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .card-status {
    position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 10px; font-size: 11px; color: #fff;
  }
  .card-info { padding: 10px; }
  .card-info .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-info .author { font-size: 12px; color: #888; }
  .card-info .progress { font-size: 12px; color: #667eea; margin-top: 6px; }
  .progress-bar { height: 4px; background: #eee; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: #667eea; border-radius: 2px; transition: width 0.3s; }

  /* 详情页 */
  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .detail-panel {
    background: #fff; width: 100%; max-width: 600px; border-radius: 20px 20px 0 0;
    padding: 20px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .detail-header { display: flex; gap: 15px; margin-bottom: 15px; }
  .detail-cover {
    width: 100px; height: 133px; border-radius: 10px; background: linear-gradient(135deg, #667eea, #764ba2);
    flex-shrink: 0; overflow: hidden; position: relative;
  }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; }
  .detail-info { flex: 1; }
  .detail-info h2 { font-size: 18px; margin-bottom: 4px; }
  .detail-info .author { color: #888; font-size: 14px; margin-bottom: 8px; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: #f0f0f0; padding: 3px 10px; border-radius: 12px; font-size: 12px; color: #555; }
  .detail-progress { margin: 15px 0; }
  .detail-progress .progress-bar { height: 8px; }
  .detail-progress .progress-text { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }
  .progress-controls { display: flex; gap: 10px; margin-top: 10px; }
  .progress-controls button {
    flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .btn-inc { background: #667eea; color: #fff; }
  .btn-dec { background: #f0f0f0; color: #333; }
  .detail-tabs { display: flex; gap: 10px; margin: 15px 0; }
  .detail-tabs span { padding: 6px 16px; border-radius: 15px; font-size: 14px; cursor: pointer; background: #f0f0f0; }
  .detail-tabs span.active { background: #1d1d1f; color: #fff; }
  .timeline { margin-top: 10px; }
  .timeline-item {
    display: flex; gap: 12px; padding: 12px 0; border-left: 2px solid #e0e0e0; margin-left: 8px; padding-left: 16px;
    position: relative;
  }
  .timeline-item::before {
    content: ''; position: absolute; left: -7px; top: 16px; width: 12px; height: 12px;
    border-radius: 50%; background: #667eea;
  }
  .timeline-item .time { font-size: 12px; color: #999; margin-bottom: 4px; }
  .timeline-item .event { font-size: 14px; }
  .timeline-item .note { font-size: 13px; color: #666; margin-top: 4px; font-style: italic; }
  .detail-fields { margin: 15px 0; }
  .field-row { display: flex; margin-bottom: 8px; font-size: 14px; }
  .field-row .label { width: 80px; color: #888; flex-shrink: 0; }
  .field-row .value { flex: 1; }
  .detail-actions { display: flex; gap: 10px; margin-top: 20px; }
  .detail-actions button {
    flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .btn-edit { background: #f0f0f0; color: #333; }
  .btn-del { background: #ff3b30; color: #fff; }

  /* 表单弹窗 */
  .form-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300;
    display: flex; align-items: center; justify-content: center;
  }
  .form-panel {
    background: #fff; border-radius: 16px; padding: 20px; width: 90%; max-width: 500px;
    max-height: 85vh; overflow-y: auto;
  }
  .form-panel h3 { margin-bottom: 15px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px;
  }
  .form-group textarea { height: 60px; resize: vertical; }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkbox-group label {
    display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 15px;
    background: #f0f0f0; font-size: 13px; cursor: pointer;
  }
  .checkbox-group input[type="checkbox"] { accent-color: #667eea; }
  .radio-group { display: flex; gap: 15px; }
  .radio-group label { display: flex; align-items: center; gap: 4px; font-size: 14px; }
  .form-actions { display: flex; gap: 10px; margin-top: 15px; }
  .form-actions button {
    flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .btn-save { background: #667eea; color: #fff; }
  .btn-cancel { background: #f0f0f0; color: #333; }
  .hidden { display: none; }
  .empty-state { text-align: center; padding: 40px; color: #999; }
  .empty-state .icon { font-size: 48px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="header">
  <h1>📚 我的阅读书单</h1>
  <div class="stats" id="statsBar">
    <span class="active" data-filter="all">全部 <span id="countAll">0</span></span>
    <span data-filter="reading">在读 <span id="countReading">0</span></span>
    <span data-filter="done">已读 <span id="countDone">0</span></span>
    <span data-filter="abandoned">弃坑 <span id="countAbandoned">0</span></span>
  </div>
  <div class="toolbar">
    <button onclick="openForm()">➕ 添加书籍</button>
    <button class="sec" onclick="openTypeManager()">🏷️ 类型库</button>
    <button class="sec" onclick="exportData()">📤 导出</button>
    <button class="sec" onclick="document.getElementById('importFile').click()">📥 导入</button>
    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 搜索书名 / 作者 / 标签 / 主角..." oninput="render()">
</div>

<div class="grid" id="grid"></div>

<!-- 详情弹窗 -->
<div class="detail-overlay hidden" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<!-- 表单弹窗 -->
<div class="form-overlay hidden" id="formOverlay" onclick="if(event.target===this)closeForm()">
  <div class="form-panel" id="formPanel"></div>
</div>

<script>
let books = JSON.parse(localStorage.getItem('reading_list_v3') || '[]');
let typeLibrary = JSON.parse(localStorage.getItem('type_library') || '["言情","古言","现言","虐恋","甜宠","穿书","重生","悬疑","科幻","玄幻"]');
let currentFilter = 'all';
let currentDetailId = null;

function saveAll() {
  localStorage.setItem('reading_list_v3', JSON.stringify(books));
  localStorage.setItem('type_library', JSON.stringify(typeLibrary));
  render();
}

function getStatus(b) {
  if (b.status) return b.status;
  if (b.current && b.total && b.current >= b.total) return 'done';
  return 'reading';
}

function getProgress(b) {
  if (!b.current || !b.total) return 0;
  return Math.min(100, Math.round(b.current / b.total * 100));
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = books.filter(b => {
    if (currentFilter !== 'all' && getStatus(b) !== currentFilter) return false;
    if (search) {
      const txt = (b.title + ' ' + b.author + ' ' + (b.tags||[]).join(' ') + ' ' + (b.heroine||'') + ' ' + (b.hero||'')).toLowerCase();
      if (!txt.includes(search)) return false;
    }
    return true;
  });

  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">📚</div><p>还没有书籍</p><p style="font-size:13px;">点击「添加书籍」开始记录</p></div>';
  } else {
    grid.innerHTML = filtered.map(b => {
      const status = getStatus(b);
      const statusMap = { reading: '在读', done: '已读', abandoned: '弃坑' };
      const statusColor = { reading: '#667eea', done: '#34c759', abandoned: '#ff3b30' };
      const prog = getProgress(b);
      const progText = b.current && b.total ? `${b.current} / ${b.total} 章 · ${prog}%` : (b.current ? `已读 ${b.current} 章` : '');
      return `
        <div class="card" onclick="openDetail(${b.id})">
          <div class="card-cover">
            ${b.cover ? `<img src="${b.cover}" onerror="this.style.display='none'">` : '📖'}
            <span class="card-status" style="background:${statusColor[status]}">${statusMap[status]}</span>
          </div>
          <div class="card-info">
            <div class="title">${escapeHtml(b.title)}</div>
            <div class="author">${escapeHtml(b.author || '')}</div>
            ${progText ? `<div class="progress">${progText}</div>
            <div class="progress-bar"><div class="fill" style="width:${prog}%"></div></div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  // 统计
  document.getElementById('countAll').innerText = books.length;
  document.getElementById('countReading').innerText = books.filter(b => getStatus(b) === 'reading').length;
  document.getElementById('countDone').innerText = books.filter(b => getStatus(b) === 'done').length;
  document.getElementById('countAbandoned').innerText = books.filter(b => getStatus(b) === 'abandoned').length;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

// 统计栏点击筛选
document.getElementById('statsBar').addEventListener('click', e => {
  const span = e.target.closest('span');
  if (!span) return;
  document.querySelectorAll('#statsBar span').forEach(s => s.classList.remove('active'));
  span.classList.add('active');
  currentFilter = span.dataset.filter;
  render();
});

// 打开详情
function openDetail(id) {
  const b = books.find(x => x.id === id);
  if (!b) return;
  currentDetailId = id;
  const status = getStatus(b);
  const statusMap = { reading: '在读', done: '已读', abandoned: '弃坑' };
  const prog = getProgress(b);
  const progText = b.current && b.total ? `${b.current} / ${b.total} 章` : (b.current ? `已读 ${b.current} 章` : '未开始');
  
  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-header">
      <div class="detail-cover">
        ${b.cover ? `<img src="${b.cover}" onerror="this.style.display='none'">` : '📖'}
      </div>
      <div class="detail-info">
        <h2>${escapeHtml(b.title)}</h2>
        <div class="author">${escapeHtml(b.author || '')}</div>
        <div class="detail-tags">
          ${(b.platform ? `<span class="tag">${escapeHtml(b.platform)}</span>` : '')}
          ${(b.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          ${(b.ending ? `<span class="tag">${escapeHtml(b.ending)}</span>` : '')}
          <span class="tag" style="background:${status==='reading'?'#667eea':status==='done'?'#34c759':'#ff3b30'};color:#fff">${statusMap[status]}</span>
        </div>
      </div>
    </div>

    <div class="detail-progress">
      <div class="progress-bar"><div class="fill" style="width:${prog}%"></div></div>
      <div class="progress-text">
        <span>${progText}</span>
        <span>${prog}%</span>
      </div>
      <div class="progress-controls">
        <button class="btn-inc" onclick="changeProgress(1)">📖 读了一章 (+1)</button>
        <button class="btn-dec" onclick="changeProgress(-1)">↩️ 回退 (-1)</button>
      </div>
    </div>

    <div class="detail-tabs">
      <span class="active" onclick="switchDetailTab('record', this)">📋 阅读记录</span>
      <span onclick="switchDetailTab('info', this)">📝 详细信息</span>
    </div>

    <div id="detailTabRecord">
      <div class="timeline" id="timeline">
        ${(b.timeline || []).map((t, i) => `
          <div class="timeline-item">
            <div class="time">${t.time}</div>
            <div class="event">${escapeHtml(t.event)}</div>
            ${t.note ? `<div class="note">💬 ${escapeHtml(t.note)}</div>` : ''}
          </div>
        `).join('') || '<div style="color:#999;font-size:13px;">暂无记录</div>'}
      </div>
      <div style="margin-top:10px;">
        <input type="text" id="timelineNote" placeholder="添加备注（如：今天熬夜看完了！）" style="width:100%;padding:8px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;">
        <button onclick="addTimelineNote()" style="margin-top:6px;padding:8px 14px;background:#f0f0f0;border:none;border-radius:8px;font-size:13px;cursor:pointer;">添加备注</button>
      </div>
    </div>

    <div id="detailTabInfo" class="hidden">
      <div class="detail-fields">
        <div class="field-row"><span class="label">平台</span><span class="value">${escapeHtml(b.platform || '未填写')}</span></div>
        <div class="field-row"><span class="label">女主角</span><span class="value">${escapeHtml(b.heroine || '未填写')}</span></div>
        <div class="field-row"><span class="label">男主角</span><span class="value">${escapeHtml(b.hero || '未填写')}</span></div>
        <div class="field-row"><span class="label">类型</span><span class="value">${(b.tags || []).length ? b.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join(' ') : '未填写'}</span></div>
        <div class="field-row"><span class="label">结局</span><span class="value">${escapeHtml(b.ending || '未填写')}</span></div>
        <div class="field-row"><span class="label">总字数</span><span class="value">${b.words ? (b.words > 10000 ? (b.words / 10000).toFixed(1) + ' 万字' : b.words + ' 字') : '未填写'}</span></div>
        <div class="field-row"><span class="label">开始日期</span><span class="value">${escapeHtml(b.startDate || '未填写')}</span></div>
        <div class="field-row"><span class="label">读完日期</span><span class="value">${escapeHtml(b.endDate || '未填写')}</span></div>
        <div class="field-row"><span class="label">评分</span><span class="value">${b.rating ? '⭐ ' + b.rating + ' / 10' : '未评分'}</span></div>
        <div class="field-row"><span class="label">简介</span><span class="value">${escapeHtml(b.desc || '暂无简介')}</span></div>
      </div>
    </div>

    <div class="detail-actions">
      <button class="btn-edit" onclick="openForm(${b.id})">✏️ 编辑</button>
      <button class="btn-del" onclick="deleteBook(${b.id})">🗑️ 删除</button>
    </div>
  `;
  document.getElementById('detailOverlay').classList.remove('hidden');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.add('hidden');
  currentDetailId = null;
}

function switchDetailTab(tab, el) {
  const panel = document.getElementById('detailPanel');
  panel.querySelectorAll('.detail-tabs span').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('detailTabRecord').classList.toggle('hidden', tab !== 'record');
  document.getElementById('detailTabInfo').classList.toggle('hidden', tab !== 'info');
}

function changeProgress(delta) {
  const b = books.find(x => x.id === currentDetailId);
  if (!b) return;
  const current = b.current || 0;
  const total = b.total || 0;
  const newVal = Math.max(0, Math.min(total || 99999, current + delta));
  if (newVal === current) return;
  b.current = newVal;
  
  const now = new Date().toLocaleString('zh-CN', { hour12: false });
  const event = delta > 0 ? `读到第 ${newVal} 章` : `回退到第 ${newVal} 章`;
  b.timeline = b.timeline || [];
  b.timeline.push({ time: now, event, note: '' });
  
  if (total && newVal >= total) {
    b.status = 'done';
    b.endDate = new Date().toISOString().slice(0, 10);
    b.timeline.push({ time: now, event: '🎉 读完啦！', note: '' });
  } else if (getStatus(b) === 'done') {
    b.status = 'reading';
    b.endDate = '';
  }
  
  saveAll();
  openDetail(b.id);
}

function addTimelineNote() {
  const b = books.find(x => x.id === currentDetailId);
  if (!b) return;
  const note = document.getElementById('timelineNote').value.trim();
  if (!note) return;
  b.timeline = b.timeline || [];
  const now = new Date().toLocaleString('zh-CN', { hour12: false });
  b.timeline.push({ time: now, event: '📝 备注', note });
  document.getElementById('timelineNote').value = '';
  saveAll();
  openDetail(b.id);
}

function deleteBook(id) {
  if (!confirm('确定删除这本书？')) return;
  books = books.filter(b => b.id !== id);
  saveAll();
  closeDetail();
}

// 表单
function openForm(id) {
  const b = id ? books.find(x => x.id === id) : null;
  const isEdit = !!b;
  const typeOptions = typeLibrary.map(t => 
    `<label><input type="checkbox" value="${t}" ${b && (b.tags || []).includes(t) ? 'checked' : ''}>${t}</label>`
  ).join('');
  
  document.getElementById('formPanel').innerHTML = `
    <h3>${isEdit ? '编辑书籍' : '添加书籍'}</h3>
    <div class="form-group">
      <label>书名 *</label>
      <input type="text" id="fTitle" value="${b ? escapeHtml(b.title) : ''}" placeholder="必填">
    </div>
    <div class="form-group">
      <label>作者</label>
      <input type="text" id="fAuthor" value="${b ? escapeHtml(b.author || '') : ''}">
    </div>
    <div class="form-group">
      <label>封面链接</label>
      <input type="text" id="fCover" value="${b ? escapeHtml(b.cover || '') : ''}" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>平台</label>
      <select id="fPlatform">
        ${['', '晋江文学城', '起点中文网', '番茄小说', '七猫小说', '微信读书', '豆瓣阅读', '其他'].map(p =>
          `<option value="${p}" ${b && b.platform === p ? 'selected' : ''}>${p || '请选择'}</option>`
        ).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>读到章节（格式：当前/总，如 0/10）</label>
      <input type="text" id="fProgress" value="${b && b.current ? b.current + (b.total ? '/' + b.total : '') : ''}" placeholder="0/10">
    </div>
    <div class="form-group">
      <label>女主角</label>
      <input type="text" id="fHeroine" value="${b ? escapeHtml(b.heroine || '') : ''}">
    </div>
    <div class="form-group">
      <label>男主角</label>
      <input type="text" id="fHero" value="${b ? escapeHtml(b.hero || '') : ''}">
    </div>
    <div class="form-group">
      <label>类型（可多选）</label>
      <div class="checkbox-group">${typeOptions}</div>
    </div>
    <div class="form-group">
      <label>结局</label>
      <div class="radio-group">
        <label><input type="radio" name="ending" value="HE" ${b && b.ending === 'HE' ? 'checked' : ''}>HE（圆满）</label>
        <label><input type="radio" name="ending" value="BE" ${b && b.ending === 'BE' ? 'checked' : ''}>BE（悲剧）</label>
        <label><input type="radio" name="ending" value="未定" ${!b || !b.ending || b.ending === '未定' ? 'checked' : ''}>未定</label>
      </div>
    </div>
    <div class="form-group">
      <label>总字数</label>
      <input type="number" id="fWords" value="${b && b.words ? b.words : ''}" placeholder="如 200000">
    </div>
    <div class="form-group">
      <label>开始日期</label>
      <input type="date" id="fStartDate" value="${b ? (b.startDate || '') : ''}">
    </div>
    <div class="form-group">
      <label>评分（0-10）</label>
      <input type="number" id="fRating" min="0" max="10" step="0.1" value="${b && b.rating ? b.rating : ''}">
    </div>
    <div class="form-group">
      <label>简介</label>
      <textarea id="fDesc">${b ? escapeHtml(b.desc || '') : ''}</textarea>
    </div>
    <div class="form-actions">
      <button class="btn-save" onclick="saveForm(${isEdit ? b.id : 'null'})">保存</button>
      <button class="btn-cancel" onclick="closeForm()">取消</button>
    </div>
  `;
  document.getElementById('formOverlay').classList.remove('hidden');
}

function closeForm() {
  document.getElementById('formOverlay').classList.add('hidden');
}

function saveForm(id) {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { alert('书名必填'); return; }
  
  const progressStr = document.getElementById('fProgress').value.trim();
  let current = 0, total = 0;
  if (progressStr) {
    if (progressStr.includes('/')) {
      const parts = progressStr.split('/');
      current = parseInt(parts[0]) || 0;
      total = parseInt(parts[1]) || 0;
    } else {
      current = parseInt(progressStr) || 0;
    }
  }
  
  const tags = Array.from(document.querySelectorAll('#formPanel input[type="checkbox"]:checked')).map(i => i.value);
  const ending = document.querySelector('#formPanel input[name="ending"]:checked')?.value || '未定';
  
  const data = {
    title,
    author: document.getElementById('fAuthor').value.trim(),
    cover: document.getElementById('fCover').value.trim(),
    platform: document.getElementById('fPlatform').value,
    current,
    total,
    heroine: document.getElementById('fHeroine').value.trim(),
    hero: document.getElementById('fHero').value.trim(),
    tags,
    ending,
    words: parseInt(document.getElementById('fWords').value) || 0,
    startDate: document.getElementById('fStartDate').value,
    rating: parseFloat(document.getElementById('fRating').value) || 0,
    desc: document.getElementById('fDesc').value.trim(),
  };
  
  if (id) {
    const idx = books.findIndex(b => b.id === id);
    if (idx >= 0) {
      const old = books[idx];
      const now = new Date().toLocaleString('zh-CN', { hour12: false });
      if (old.current !== data.current) {
        old.timeline = old.timeline || [];
        old.timeline.push({ time: now, event: `进度更新为第 ${data.current} 章`, note: '' });
      }
      books[idx] = { ...old, ...data };
    }
  } else {
    const now = new Date().toLocaleString('zh-CN', { hour12: false });
    const newBook = {
      id: Date.now(),
      ...data,
      status: 'reading',
      timeline: [{ time: now, event: '📖 开始阅读', note: '' }]
    };
    books.unshift(newBook);
  }
  
  saveAll();
  closeForm();
  if (id) openDetail(id);
}

// 类型库管理
function openTypeManager() {
  document.getElementById('formPanel').innerHTML = `
    <h3>🏷️ 类型库管理</h3>
    <div style="margin-bottom:10px;">
      <input type="text" id="newType" placeholder="输入新类型，如：科幻" style="width:100%;padding:8px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;">
      <button onclick="addType()" style="margin-top:6px;padding:8px 14px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;">添加</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      ${typeLibrary.map(t => `
        <span style="display:inline-flex;align-items:center;gap:4px;background:#f0f0f0;padding:4px 10px;border-radius:12px;font-size:13px;">
          ${t}
          <span onclick="removeType('${t}')" style="cursor:pointer;color:#ff3b30;font-weight:bold;">×</span>
        </span>
      `).join('')}
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeForm()">关闭</button>
    </div>
  `;
  document.getElementById('formOverlay').classList.remove('hidden');
}

function addType() {
  const t = document.getElementById('newType').value.trim();
  if (!t) return;
  if (!typeLibrary.includes(t)) typeLibrary.push(t);
  saveAll();
  openTypeManager();
}

function removeType(t) {
  if (!confirm(`删除类型「${t}」？`)) return;
  typeLibrary = typeLibrary.filter(x => x !== t);
  books.forEach(b => { b.tags = (b.tags || []).filter(x => x !== t); });
  saveAll();
  openTypeManager();
}

// 导出导入
function exportData() {
  const data = JSON.stringify({ books, typeLibrary }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `阅读书单备份_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.books) {
        books = data.books;
        if (data.typeLibrary) typeLibrary = data.typeLibrary;
      } else if (Array.isArray(data)) {
        books = data;
      } else {
        throw new Error('格式不对');
      }
      saveAll();
      alert('导入成功！');
    } catch (err) {
      alert('文件格式错误，无法导入');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// 统计栏点击
document.getElementById('statsBar').addEventListener('click', e => {
  const span = e.target.closest('span');
  if (!span) return;
  document.querySelectorAll('#statsBar span').forEach(s => s.classList.remove('active'));
  span.classList.add('active');
  currentFilter = span.dataset.filter;
  render();
});

// 初始化
render();
</script>
</body>
